version: '3.8'

services:
  hustlebot:
    build: .
    container_name: hustlebot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HUSTLEBOT_HEADLESS=true
      - HUSTLEBOT_DIR=/data/.hustlebot
    volumes:
      # Persistent data (profile, gigs, proposals, pipeline, etc.)
      - hustlebot-data:/data/.hustlebot
      # Browser profile (cookies, sessions)
      - hustlebot-browser:/data/.hustlebot/browser-profile
      # NopeCHA extension (mount your own)
      - ./extensions/nopecha:/app/extensions/nopecha:ro
    ports:
      - "3456:3456"
    shm_size: '2gb'  # Chromium needs shared memory
    healthcheck:
      test: ["CMD", "node", "src/index.js", "health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  hustlebot-data:
  hustlebot-browser: